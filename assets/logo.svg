<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>

    <!-- Shield Safe Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Threat / Quarantine Gradient -->
    <linearGradient id="threat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <linearGradient id="core-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="160" fill="url(#bg-grad)" />
  <rect width="796" height="796" x="2" y="2" rx="158" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Defense Grid Pattern -->
  <g opacity="0.12" stroke="#10B981" stroke-width="1.5">
    <circle cx="400" cy="380" r="140" fill="none" stroke-dasharray="6 6" />
    <circle cx="400" cy="380" r="230" fill="none" stroke-dasharray="8 8" />
    <circle cx="400" cy="380" r="310" fill="none" />
    <line x1="400" y1="80" x2="400" y2="680" stroke-dasharray="4 8" />
    <line x1="100" y1="380" x2="700" y2="380" stroke-dasharray="4 8" />
  </g>

  <!-- Outer Airgap Quarantine Barrier (Severed Ring) -->
  <path d="M 220 220 A 250 250 0 0 1 580 220" fill="none" stroke="url(#threat-grad)" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />
  <path d="M 580 540 A 250 250 0 0 1 220 540" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="8 8" />

  <!-- The Autonomous Airgap Shield (Main Symbol) -->
  <path d="M 400 160 
           L 570 240 
           C 570 420, 480 540, 400 600 
           C 320 540, 230 420, 230 240 
           Z" 
        fill="url(#core-glow)" 
        stroke="url(#shield-grad)" 
        stroke-width="12" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Internal Circuit Breaker / Airgap Blade Geometry -->
  <!-- Left Side: Protected Bastion -->
  <path d="M 370 230 
           L 300 270 
           C 300 390, 340 480, 370 520 
           Z" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="6" 
        stroke-linejoin="round" />

  <!-- Right Side: Severed Threat Vector -->
  <path d="M 430 230 
           L 500 270 
           C 500 390, 460 480, 430 520 
           Z" 
        fill="none" 
        stroke="#06B6D4" 
        stroke-width="6" 
        stroke-linejoin="round" />

  <!-- Central Airgap Lightning / Disconnect Path -->
  <path d="M 410 200 
           L 370 330 
           L 420 350 
           L 380 480 
           L 440 370 
           L 390 350 
           Z" 
        fill="#F8FAFC" 
        stroke="#22D3EE" 
        stroke-width="3" 
        filter="url(#subtle-glow)" />

  <!-- Node Cluster Telemetry Dots (Dynatrace SRE Topology Nodes) -->
  <g fill="#10B981" filter="url(#subtle-glow)">
    <circle cx="330" cy="330" r="8" />
    <circle cx="350" cy="420" r="7" />
    <circle cx="310" cy="400" r="6" />
  </g>
  <g fill="#EF4444" filter="url(#subtle-glow)">
    <circle cx="470" cy="330" r="8" />
    <circle cx="450" cy="420" r="7" />
    <circle cx="490" cy="400" r="6" />
  </g>

  <!-- Typography -->
  <text x="400" y="685" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#F8FAFC" letter-spacing="4">
    RAN<tspan fill="#10B981">SAFE</tspan>
  </text>
  <text x="400" y="720" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="3">
    AUTONOMOUS RANSOMWARE AIRGAP SRE
  </text>
</svg>
